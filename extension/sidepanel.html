<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 10px;
         padding-bottom: 70px; }  /* leaves room so the last bubble isn't hidden behind the input row */

  h1 { font-size: 32px; color: #4B9CD3; margin: 4px 0 10px; }  /* the logo text */

  /* Both buttons share one style: dark blue, white text, no border */
  button { background: #1A4A6B; color: white; border: none;
           padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }

  /* Pinned to the bottom edge of the panel, so it stays put as the chat grows */
  #inputRow { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
              gap: 8px; padding: 10px; background: white;
              border-top: 1px solid #ddd; }
  #question { flex: 1; padding: 8px; font-size: 14px;
              border: 1px solid #ccc; border-radius: 8px; }

  #log { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }

  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 18px;
            line-height: 1.3; white-space: pre-wrap; overflow-wrap: break-word; }
  .user { align-self: flex-end;   background: #4B9CD3; color: white;
          border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #C1D5EA; color: #1a1a1a;
          border-bottom-left-radius: 4px; }

  .typing span { display: inline-block; width: 8px; height: 8px; margin: 0 2px;
                 border-radius: 50%; background: #5d7391;
                 animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0);    opacity: 0.4; }
    30%           { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
  <h1>BrowseBuddy</h1>
  <button id="load">Load this page</button>
  <p id="status">No page loaded.</p>
  <div id="log"></div>

  <!-- Input row: pinned to the bottom by the #inputRow style above -->
  <div id="inputRow">
    <input id="question" placeholder="Ask about the page..." disabled>
    <button id="send" disabled>Ask</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
